name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test Go backend
        working-directory: backend
        run: go test -race ./...
      - name: Compile QNAP binaries
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/nas-photos .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/qpkg-runner ./cmd/qpkg-runner
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Test, lint and compile launcher
        run: ./launcher/gradlew -p launcher --no-daemon testReleaseUnitTest lintRelease assembleRelease
