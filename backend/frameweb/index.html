<main id="frame" aria-label="照片相框">
 <canvas class="scene" aria-hidden="true"></canvas><canvas class="scene" aria-hidden="true"></canvas>

<section id="controls" aria-label="照片控制" inert>

 <div class="actions">

  <button id="play" aria-label="暫停播放"><svg viewBox="0 0 24 24"><path id="play-path" d="M9 6v12M15 6v12"/></svg></button>
  <button id="next" aria-label="下一張"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
  <button id="fullscreen" aria-label="全螢幕"><svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
 </div>
</section>
